name: Actualizar tarjetas del perfil

# Genera las tarjetas de estadísticas como SVG estáticos dentro del repo (carpeta profile/),
# con la paleta zine del portafolio (tinta, papel y rojo). Así el README no depende de servicios públicos que se caen.

on:
  schedule:
    - cron: "17 5 * * *" # una vez al día
  push:
    paths:
      - ".github/workflows/profile-cards.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    env:
      # Para contar también repos privados: crea un PAT (scopes: repo, read:user),
      # guárdalo como secreto PROFILE_TOKEN y se usará automáticamente.
      CARDS_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Estadísticas
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&locale=es&hide_border=false&border_radius=0&bg_color=FBFBFA&title_color=111111&text_color=111111&icon_color=FF2B2B&ring_color=FF2B2B&border_color=111111
          path: profile/stats.svg
          token: ${{ env.CARDS_TOKEN }}

      - name: Lenguajes
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&locale=es&border_radius=0&bg_color=FBFBFA&title_color=111111&text_color=111111&border_color=111111
          path: profile/top-langs.svg
          token: ${{ env.CARDS_TOKEN }}

      - name: Racha
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&locale=es&border_radius=0&disable_animations=true&card_width=840&background=FBFBFA&border=111111&stroke=111111&ring=FF2B2B&fire=FF2B2B&currStreakNum=111111&sideNums=111111&currStreakLabel=FF2B2B&sideLabels=111111&dates=444444
          path: profile/streak.svg
          token: ${{ env.CARDS_TOKEN }}

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Actualizar tarjetas del perfil" || exit 0
          git push
